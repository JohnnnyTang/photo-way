# Throwaway spike S1 (HEIC decoding). Not part of the root workspace.
[package]
name = "heic-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

# Own (empty) workspace so this crate never joins the root workspace.
[workspace]

[features]
default = ["heic"]
# HEIC via libheif-rs, linking a libheif found by libheif-sys
# (vcpkg on Windows MSVC, pkg-config elsewhere).
heic = ["dep:libheif-rs"]
# libheif-sys "embedded-libheif": builds the vendored libheif with cmake.
# NOTE: ignored on Windows MSVC (libheif-sys always uses vcpkg there) and it
# does NOT build libde265 -- see docs/spikes/S1-heic.md.
embedded = ["heic", "libheif-rs/embedded-libheif"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
fast_image_resize = "6.1.0"
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }

# Same release profile as the root workspace, so size numbers are representative.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
