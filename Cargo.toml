[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JohnnnyTang/photo-way"
rust-version = "1.88"

[workspace.dependencies]
photoway-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
