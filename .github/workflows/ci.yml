name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned vcpkg tag; see docs/spikes/S1-heic.md. Keep in sync with release.yml.
  VCPKG_TAG: "2026.10.16"

jobs:
  # Build order: viewer (vite) -> app UI (vite) -> cargo. Core embeds viewer/dist and the app
  # needs app/dist for tauri::generate_context!, so the Rust jobs rebuild them rather than download.
  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-text.mjs
      - name: Versions agree (Cargo, npm, tauri.conf)
        run: node scripts/version-sync.mjs --check
      - run: npm run fixtures
      # Viewer scripts below are provided by Wave 1 · C; --if-present keeps this job green before and after.
      - run: npm run lint -w viewer --if-present
      - run: npm run typecheck -w viewer --if-present
      - run: npm run test -w viewer --if-present -- --passWithNoTests
      - run: npm run build -w viewer
      - name: Size budgets (viewer bundle, basemap)
        run: node scripts/check-size.mjs --only viewer,basemap --require
      - name: Install Playwright browsers
        if: hashFiles('viewer/playwright.config.*') != ''
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end (Playwright, file://)
        if: hashFiles('viewer/playwright.config.*') != ''
        run: npm run test:e2e -w viewer --if-present
      - uses: actions/upload-artifact@v7
        with:
          name: viewer-dist
          path: viewer/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure() && hashFiles('viewer/playwright.config.*') != ''
        with:
          name: playwright-report
          path: |
            viewer/playwright-report
            viewer/test-results
          if-no-files-found: ignore

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w viewer
      - run: npm run build -w app

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Windows/macOS: libheif + libde265 static via vcpkg (cached). No-op until scripts/setup-libheif.* land.
      - uses: ./.github/actions/setup-libheif
        if: runner.os != 'Linux'

      # Linux: distro libheif-dev (Ubuntu 24.04 ships 1.17.6, the minimum the `v1_17` feature needs) is linked
      # dynamically. Fine for CI; Linux binaries are not shipped yet. Plus the Tauri/WebKitGTK build deps.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libheif-dev libheif-plugin-libde265 pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          # The vcpkg triplet is part of the build inputs for libheif-sys.
          key: ${{ hashFiles('vcpkg/triplets/*') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Build CLI (release)
        run: cargo build --release -p photoway-cli

      # Windows: only OS/UCRT DLLs, no VCRUNTIME140/MSVCP140. macOS: only /usr/lib and /System.
      # Enabled once libheif is statically linked with the static CRT (Wave 1 · B), because before
      # that the default dynamic CRT legitimately imports VCRUNTIME140.dll.
      - name: Binary import assertion
        if: runner.os != 'Linux' && hashFiles('scripts/setup-libheif.sh') != ''
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          node scripts/check-imports.mjs "target/release/photoway$ext"

      - name: Collect CLI binary
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p cli-out
          cp "target/release/photoway$ext" cli-out/
      - uses: actions/upload-artifact@v7
        with:
          name: photoway-cli-${{ runner.os }}
          path: cli-out
          if-no-files-found: error

  # Wave 2 · G: the photoway CLI builds html/dir/zip outputs, then Playwright (Chromium, Firefox, WebKit) opens each
  # from file:// and over HTTP (`photoway serve`), plus perf and output size gates. See docs/WAVE2_GATE.md.
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # TODO(Wave 2 · E): uncomment once the photoway CLI (build/serve/bundle writers) has merged, so the suite can
      # no longer fall back to the viewer reference layouts. Until then the fallback keeps main green.
      # PW_E2E_REQUIRE_CLI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w viewer
      - run: npm run fixtures

      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-libheif
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('vcpkg/triplets/*') }}
      - name: Build CLI (release)
        run: cargo build --release -p photoway-cli
      - name: Point the suite at the CLI
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          echo "PW_CLI=${{ github.workspace }}/target/release/photoway$ext" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: viewer
      - name: End-to-end outputs, perf and size (Playwright)
        run: npx playwright test
        working-directory: viewer
      - name: Output size budgets
        shell: bash
        run: |
          ids=shell,output-html,output-dir
          [ "$PW_E2E_REQUIRE_CLI" = 1 ] && ids="$ids,output-zip"
          node scripts/check-size.mjs --only "$ids" --require
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}
          path: |
            viewer/playwright-report
            viewer/test-results
          if-no-files-found: ignore

  # Single stable name for branch protection: require "CI OK" and nothing else.
  ci-ok:
    name: CI OK
    if: always()
    needs: [viewer, rust, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*|*" skipped "*) echo "::error::A required job did not succeed"; exit 1 ;;
          esac
